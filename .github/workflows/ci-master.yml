name: CI Master

on:
  push:
    branches: [ master ]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            testflags: '-race'
          # The race detector needs cgo and a C compiler. Add '-race' here once
          # the windows runner is known to provide one.
          - os: windows-latest
            testflags: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "code not formatted. Please run 'go fmt ./...':"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v ${{ matrix.testflags }} -coverprofile=coverage.txt -covermode=atomic
